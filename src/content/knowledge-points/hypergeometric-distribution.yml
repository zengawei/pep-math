id: hypergeometric-distribution
name: 超几何分布
category: 概率
description: |
  在含有 M 件次品的 N 件产品中，不放回地任取 n 件，
  设 X 表示取出的 n 件产品中次品的件数，则 X 服从超几何分布。
  其概率分布为 P(X = k) = C(M, k) · C(N-M, n-k) / C(N, n)，
  其中 max(0, n-(N-M)) ≤ k ≤ min(n, M)。
  超几何分布的期望 E(X) = nM/N。
  超几何分布描述的是不放回抽样问题；当总体数量 N 很大而样本量 n 相对很小时，
  超几何分布近似于二项分布（此时放回与不放回差别不大）。
  超几何分布与二项分布的核心区别：超几何分布是不放回抽样，各次抽取不独立。
prerequisites:
  - discrete-random-variable
  - combination
follow_ups:
  - expected-value-variance
related:
  - discrete-random-variable
  - combination
formulas:
  - "P(X = k) = \\frac{\\binom{M}{k} \\binom{N-M}{n-k}}{\\binom{N}{n}}"
  - "E(X) = \\frac{nM}{N}"
common_mistakes:
  - mistake: "对放回抽样问题使用超几何分布"
    correction: "超几何分布适用于不放回抽样；若是有放回抽样且各次独立，应使用二项分布"
  - mistake: "混淆参数 M、N、n 的含义"
    correction: "N 是总数，M 是特殊品（如次品）数，n 是抽取数，k 是抽到的特殊品数，要仔细审题对应"
  - mistake: "忽略 k 的取值范围"
    correction: "k 的范围受 M 和 n 双重限制：max(0, n-(N-M)) ≤ k ≤ min(n, M)，超出范围组合数为 0"
