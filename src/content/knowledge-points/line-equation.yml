formulas:
  - "y - y_0 = k(x - x_0)"
  - "y = kx + b"
  - "\\frac{x}{a} + \\frac{y}{b} = 1"
  - "Ax + By + C = 0"
  - "l_1 \\perp l_2 \\Leftrightarrow k_1 k_2 = -1"
common_mistakes:
  - mistake: "使用点斜式时忽略斜率不存在的情况"
    correction: "斜率不存在时直线方程为 x = x₀，不能写成点斜式。解题时需先讨论斜率是否存在"
  - mistake: "使用截距式时忽略截距为零的情况"
    correction: "截距式要求 a ≠ 0 且 b ≠ 0。过原点的直线不能用截距式"
applied_in:
