id: solid-geometry-basics
name: 基本立体图形
category: 立体几何
description: |
  常见基本立体图形：
  棱柱：两个底面平行且全等，侧面为平行四边形。
  棱锥：一个底面，侧面为共顶点的三角形。
  棱台：棱锥被平行于底面的平面截得。
  圆柱、圆锥、圆台：由矩形、直角三角形、直角梯形绕直角边旋转得到。
  球：到定点距离等于定长的点的集合。
