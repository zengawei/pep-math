id: independence-test
name: 独立性检验
category: 统计
description: |
  独立性检验是判断两个分类变量之间是否有关系的统计方法。
  其基本思想类似于数学中的反证法：先假设两个变量没有关系（即独立），
  然后计算在该假设下观测到当前数据的概率，若概率很小，则拒绝假设，
  认为两个变量之间有关系。

  独立性检验的基本步骤：
  1. 根据样本数据列出 2×2 列联表
  2. 计算 χ² 统计量
  3. 将 χ² 值与临界值比较，作出判断

  χ² 统计量公式（2×2 列联表）：
  χ² = n(ad - bc)² / [(a+b)(c+d)(a+c)(b+d)]
  其中 n = a + b + c + d 为样本总量。

  常用临界值：
  - P(χ² ≥ 3.841) ≈ 0.05：有 95% 的把握认为两个变量有关系
  - P(χ² ≥ 6.635) ≈ 0.01：有 99% 的把握认为两个变量有关系
  - P(χ² ≥ 10.828) ≈ 0.001：有 99.9% 的把握认为两个变量有关系

  注意事项：
  - χ² 值越大，说明两个变量有关系的证据越充分
  - 独立性检验的结论是概率性的，不是确定性的
  - "有 95% 的把握"意味着犯错误的概率不超过 5%，而不是"有 95% 的可能性"
prerequisites:
  - contingency-table
  - frequency-probability
follow_ups:
  - statistical-case
related:
  - contingency-table
formulas:
  - "\\chi^2 = \\frac{n(ad - bc)^2}{(a+b)(c+d)(a+c)(b+d)}"
  - "n = a + b + c + d"
common_mistakes:
  - mistake: "认为独立性检验的结论是确定的"
    correction: "独立性检验的结论是概率性的，只能说'有多大把握认为两个变量有关系'，不能给出确定性的结论"
  - mistake: "计算时忘记对 (ad - bc) 进行平方"
    correction: "公式中 (ad - bc) 必须平方，即 (ad - bc)²，不能遗漏平方运算"
  - mistake: "将'95%的把握'理解为'95%的可能性'"
    correction: "'有95%的把握认为两个变量有关系'是指：如果两个变量实际无关，那么出现当前观测结果的概率不超过5%，即犯第一类错误的概率不超过5%"
  - mistake: "样本量太小就进行独立性检验"
    correction: "独立性检验要求样本量足够大，一般要求列联表中每个格子的期望频数不小于5，否则检验结果不可靠"
applied_in:
  - textbook: selective-3
    chapters: [18]
