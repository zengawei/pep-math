id: vector-concept
name: 平面向量的概念
category: 向量
description: |
  既有大小又有方向的量叫做向量（也称矢量）。
  向量的大小叫做向量的模（长度），记作 |a|。
  零向量：长度为 0 的向量，记作 0。
  单位向量：模为 1 的向量。
  相等向量：大小相等且方向相同的向量。
  相反向量：大小相等但方向相反的向量。
  共线向量（平行向量）：方向相同或相反的向量，记作 a∥b。
prerequisites: []
follow_ups:
  - vector-addition-subtraction
  - vector-scalar-multiplication
  - space-vector-concept
related:
  - function-concept
formulas:
  - "|\\vec{a}| \\geq 0"
  - "\\vec{0}: |\\vec{0}| = 0"
common_mistakes:
  - mistake: "混淆向量与标量，认为向量可以比较大小"
    correction: "向量有方向，不能直接比较大小；只有向量的模（标量）才能比较大小"
  - mistake: "认为方向相同的向量就是相等向量"
    correction: "相等向量必须同时满足模相等且方向相同"
applied_in:
  - textbook: required-2
    chapters: [6]
