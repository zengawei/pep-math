formulas:
  - "a_n = f(n), \\quad n \\in \\mathbb{N}^*"
common_mistakes:
  - mistake: "将数列与集合混淆"
    correction: "数列中的数是有顺序的，且可以重复；集合中的元素无序且互异"
  - mistake: "混淆通项公式与递推公式"
    correction: "通项公式直接给出 a_n 与 n 的关系；递推公式给出 a_n 与前一项（或前几项）的关系"
