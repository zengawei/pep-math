id: conditional-probability
name: 条件概率
category: 概率
description: |
  设 A、B 为两个事件，且 P(A) > 0，则在事件 A 发生的条件下事件 B 发生的概率，
  称为条件概率，记作 P(B|A)。
  条件概率的定义公式为 P(B|A) = P(AB) / P(A)，其中 P(AB) 为事件 A 与 B 同时发生的概率。
  由定义可得乘法公式 P(AB) = P(A) · P(B|A)。
  条件概率满足概率的基本性质：非负性、规范性（P(Ω|A) = 1）、可列可加性。
  条件概率的本质是在缩小了的样本空间（事件 A 发生）中重新计算概率。
prerequisites:
  - random-event-probability
  - frequency-probability
follow_ups:
  - total-probability
  - probability-addition-multiplication
related:
  - random-event-probability
formulas:
  - "P(B|A) = \\frac{P(AB)}{P(A)}, \\quad P(A) > 0"
  - "P(AB) = P(A) \\cdot P(B|A)"
common_mistakes:
  - mistake: "混淆 P(AB) 与 P(B|A)"
    correction: "P(AB) 是在原样本空间中 A、B 同时发生的概率；P(B|A) 是在 A 已发生的缩小样本空间中 B 发生的概率，两者分母不同"
  - mistake: "认为 P(B|A) = P(A|B)"
    correction: "P(B|A) 与 P(A|B) 一般不相等，它们分别以 P(A) 和 P(B) 为分母，仅在特殊情况下相等"
applied_in:
  - textbook: selective-3
    chapters: [17]
