id: statistical-case
name: 统计案例的综合应用
category: 统计
description: |
  统计案例的综合应用是将回归分析和独立性检验等统计方法运用于实际问题中，
  通过数据分析得出结论的综合性学习内容。

  一、回归分析的应用场景：
  - 研究两个连续型变量之间的线性关系
  - 通过已知变量预测未知变量
  - 典型问题：身高与体重、温度与销量、广告费与销售额等

  二、独立性检验的应用场景：
  - 判断两个分类变量之间是否有关联
  - 典型问题：性别与偏好、地区与习惯、吸烟与患病等

  三、如何选择统计方法：
  - 若两个变量都是连续型变量，且研究其数量关系 → 回归分析
  - 若两个变量都是分类变量，且研究其是否有关联 → 独立性检验
  - 若需要用一个变量预测另一个变量 → 回归分析

  四、统计结论的规范表述：
  - 回归分析的预测结果应使用"估计""预测"等词语
  - 独立性检验的结论应使用"有XX%的把握认为……"的表述
  - 避免使用"一定""必然""肯定"等确定性词语

  五、综合应用的基本流程：
  1. 明确问题，确定研究目的
  2. 收集数据，整理数据
  3. 选择合适的统计方法
  4. 进行计算和分析
  5. 用规范的语言得出结论
prerequisites:
  - regression-analysis
  - independence-test
follow_ups: []
related:
  - correlation-analysis
  - contingency-table
formulas:
  - "\\hat{y} = \\hat{b}x + \\hat{a} \\quad \\text{（回归方程）}"
  - "\\chi^2 = \\frac{n(ad - bc)^2}{(a+b)(c+d)(a+c)(b+d)} \\quad \\text{（独立性检验）}"
common_mistakes:
  - mistake: "对超出数据范围的值进行外推预测"
    correction: "回归方程只适用于样本数据覆盖的范围内进行预测，超出范围的预测（外推）可能完全不可靠，因为变量间的关系在更大范围内可能不是线性的"
  - mistake: "对概率性结论使用确定性语言"
    correction: "统计推断的结论都是概率性的，应使用'有95%的把握认为''估计''大约'等表述，不能使用'一定''必然''肯定'等绝对化词语"
  - mistake: "混淆回归分析和独立性检验的适用场景"
    correction: "回归分析适用于两个连续型变量之间的数量关系研究；独立性检验适用于两个分类变量之间关联性研究；选择方法前应先判断变量类型"
  - mistake: "忽略统计分析的前提条件"
    correction: "回归分析要求变量间存在线性相关关系（需先画散点图判断）；独立性检验要求样本量足够大（期望频数≥5）；忽略前提条件会导致结论不可靠"
applied_in:
  - textbook: selective-3
    chapters: [18]
source: 自编
