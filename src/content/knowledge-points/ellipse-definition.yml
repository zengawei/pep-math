formulas:
  - "\\frac{x^2}{a^2} + \\frac{y^2}{b^2} = 1 \\quad (a > b > 0)"
  - "c^2 = a^2 - b^2"
  - "e = \\frac{c}{a} \\in (0, 1)"
  - "|PF_1| + |PF_2| = 2a"
common_mistakes:
  - mistake: "混淆 a² = b² + c² 与 c² = a² + b²"
    correction: "椭圆中 a 最大，关系为 a² = b² + c²。双曲线中 c 最大，关系为 c² = a² + b²"
  - mistake: "忽略 2a > |F₁F₂| 的条件"
    correction: "椭圆定义要求 2a > 2c（即 a > c）。若 2a = 2c 轨迹为线段，2a < 2c 无轨迹"
applied_in:
